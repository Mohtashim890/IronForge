name: IronForge CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ironforge-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:

  publish-images:
    name: Publish Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Set image prefix
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./IronForge.Api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ironforge-api:${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./IronForge.Web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ironforge-web:${{ github.sha }}

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./IronForge.Mcp/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ironforge-mcp:${{ github.sha }}

      - name: Build and push MCP Client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./IronForge.Mcp.Client/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ironforge-mcp-client:${{ github.sha }}

      - name: Build and push Migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./IronForge.Migrator/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ironforge-migrator:${{ github.sha }}
            
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: publish-images

    steps:
  - name: Prepare SSH credentials
    env:
      VPS_SSH_KEY: ${{ secrets.IRONFORGE_VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.IRONFORGE_VPS_KNOWN_HOSTS }}
    run: |
      install -m 700 -d ~/.ssh

      printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/ironforge_deploy
      chmod 600 ~/.ssh/ironforge_deploy

      printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      chmod 644 ~/.ssh/known_hosts

      ssh-keygen -y -f ~/.ssh/ironforge_deploy > /dev/null
      echo "Deployment private key parsed successfully."

  - name: Deploy to DigitalOcean VPS
    env:
      VPS_HOST: ${{ secrets.IRONFORGE_VPS_HOST }}
      VPS_USER: ${{ secrets.IRONFORGE_VPS_USER }}
    run: |
      ssh \
        -i ~/.ssh/ironforge_deploy \
        -o BatchMode=yes \
        -o StrictHostKeyChecking=yes \
        "${VPS_USER}@${VPS_HOST}" \
        "/opt/ironforge/scripts/deploy.sh '${GITHUB_SHA}'"