name: IronForge CD

# CD runs only after the IronForge CI workflow has completed for main.
# The publish-images job then checks that CI succeeded and was a push,
# and deploys exactly the commit CI tested (workflow_run.head_sha).
on:
  workflow_run:
    workflows: ["IronForge CI"]
    types: [completed]
    branches: [main]

run-name: Deploy ${{ github.event.workflow_run.head_sha }}

permissions:
  contents: read
  packages: write

# Never cancel a running deploy (deploy.sh may be mid-migration).
concurrency:
  group: ironforge-cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:

  publish-images:
    name: Publish Docker images
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
        
      - name: Set image prefix
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./IronForge.Api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ironforge-api:${{ env.RELEASE_SHA }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./IronForge.Web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ironforge-web:${{ env.RELEASE_SHA }}

      - name: Build and push Platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./IronForge.Platform/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ironforge-platform:${{ env.RELEASE_SHA }}

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./IronForge.Mcp/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ironforge-mcp:${{ env.RELEASE_SHA }}

      - name: Build and push MCP Client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./IronForge.Mcp.Client/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ironforge-mcp-client:${{ env.RELEASE_SHA }}

      - name: Build and push Migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./IronForge.Migrator/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ironforge-migrator:${{ env.RELEASE_SHA }}
            
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: publish-images

    steps:
        - name: Prepare SSH credentials
          env:
              VPS_SSH_KEY: ${{ secrets.IRONFORGE_VPS_SSH_KEY }}
              VPS_KNOWN_HOSTS: ${{ secrets.IRONFORGE_VPS_KNOWN_HOSTS }}
          run: |
              install -m 700 -d ~/.ssh
          
              printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/ironforge_deploy
              chmod 600 ~/.ssh/ironforge_deploy
          
              printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
              chmod 644 ~/.ssh/known_hosts
          
              ssh-keygen -y -f ~/.ssh/ironforge_deploy > /dev/null
              echo "Deployment private key parsed successfully."
        
        - name: Deploy to DigitalOcean VPS
          env:
              VPS_HOST: ${{ secrets.IRONFORGE_VPS_HOST }}
              VPS_USER: ${{ secrets.IRONFORGE_VPS_USER }}
          run: |
              ssh \
                  -i ~/.ssh/ironforge_deploy \
                  -o BatchMode=yes \
                  -o StrictHostKeyChecking=yes \
                  "${VPS_USER}@${VPS_HOST}" \
                  "/opt/ironforge/scripts/deploy.sh '${RELEASE_SHA}'"