name: IronForge CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ironforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    name: Build IronForge

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore ./IronForge.Server.slnx

      - name: Build
        run: dotnet build ./IronForge.Server.slnx --configuration Release --no-restore
        
      - name: Run unit tests
        run: >
          dotnet test
          ./tests/IronForge.Application.Tests/IronForge.Application.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory ./TestResults/Unit
          
      - name: Run integration tests
        run: >
            dotnet test
            ./tests/IronForge.Application.IntegrationTests/IronForge.Application.IntegrationTests.csproj
            --configuration Release
            --no-build
            --logger "trx;LogFileName=integration-tests.trx"
            --results-directory ./TestResults/Integration
            
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
            name: test-results
            path: ./TestResults
            if-no-files-found: warn
      
      - name: Publish API
        run: >
            dotnet publish
            ./IronForge.Api/IronForge.Api.csproj
            --configuration Release
            --no-restore
            --output ./artifacts/api
    
      - name: Publish Web
        run: >
            dotnet publish
            ./IronForge.Web/IronForge.Web.csproj
            --configuration Release
            --no-restore
            --output ./artifacts/web
            
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
            name: ironforge-build
            path: ./artifacts
            if-no-files-found: warn