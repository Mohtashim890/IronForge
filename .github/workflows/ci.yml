name: IronForge CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ironforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Build IronForge
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore ./IronForge.Server.slnx
        
      - name: Check vulnerable dependencies
        run: >
            dotnet list
            ./IronForge.Server.slnx
            package
            --vulnerable
            --include-transitive

      - name: Build
        run: dotnet build ./IronForge.Server.slnx --configuration Release --no-restore
        
      - name: Run unit tests
        run: >
          dotnet test
          ./tests/IronForge.Application.Tests/IronForge.Application.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory ./TestResults/Unit
          
      - name: Run integration tests
        run: >
            dotnet test
            ./tests/IronForge.Application.IntegrationTests/IronForge.Application.IntegrationTests.csproj
            --configuration Release
            --no-build
            --logger "trx;LogFileName=integration-tests.trx"
            --results-directory ./TestResults/Integration
            
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
            name: test-results
            path: ./TestResults
            if-no-files-found: warn
      
      - name: Publish API
        run: >
            dotnet publish
            ./IronForge.Api/IronForge.Api.csproj
            --configuration Release
            --no-restore
            --output ./artifacts/api
    
      - name: Publish Web
        run: >
            dotnet publish
            ./IronForge.Web/IronForge.Web.csproj
            --configuration Release
            --no-restore
            --output ./artifacts/web
            
      - name: Publish Web
        run: >
            dotnet publish
            ./IronForge.Mcp/IronForge.Mcp.csproj
            --configuration Release
            --no-restore
            --output ./artifacts/mcp
            
      - name: Publish Web
        run: >
            dotnet publish
            ./IronForge.Mcp.Client/IronForge.Mcp.Client.csproj
            --configuration Release
            --no-restore
            --output ./artifacts/mcp-client
            
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
            name: ironforge-build
            path: ./artifacts
            if-no-files-found: warn
            
  docker:
    name: Docker validation
    needs: server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Validate Docker Compose configuration
        env:
            CONNECTIONSTRINGS__DEFAULTCONNECTION: Host=ci-placeholder
            JWTSETTINGS__KEY: ci-placeholder-jwt-key
            AISETTINGS__APIKEY: ci-placeholder-ai-key
            OPENTELEMETRY__OTLP__HEADERS: "Authorization asdakdaskdbakdhaskdh"
        run: docker compose config
      
      - name: Build Docker images
        run: >
            docker compose build
            ironforge-api
            ironforge-web
            ironforge-mcp
            ironforge-mcp-client
            ironforge-migrator
            
  maui:
    name: Build MAUI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Restore MAUI
        run: >
          dotnet restore 
          ./IronForge/IronForge.csproj 
          -p:TargetFramework=net10.0-android


      - name: Build MAUI Android
        run: >
          dotnet build
          ./IronForge/IronForge.csproj
          --configuration Release
          --framework net10.0-android
          --no-restore
          
